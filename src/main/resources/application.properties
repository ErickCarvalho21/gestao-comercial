spring.datasource.url=jdbc:postgresql://localhost:5432/gestao_comercial
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.security.jwt-secret=${APP_JWT_SECRET}
app.security.bootstrap-admin.name=${APP_BOOTSTRAP_ADMIN_NAME:}
app.security.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.security.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
